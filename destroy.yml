---
- name: Destroy Dynamic PHP Portfolio
  hosts: localhost
  become: true

  tasks:

    - name: Remove PHP portfolio
      ansible.builtin.file:
        path: /var/www/html/index.php
        state: absent

    - name: Remove initialization SQL file
      ansible.builtin.file:
        path: /tmp/init.sql
        state: absent

    - name: Remove PostgreSQL database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: vn7
        state: absent

    - name: Remove PostgreSQL user
      become_user: postgres
      community.postgresql.postgresql_user:
        name: code
        state: absent

    - name: Stop and disable Apache
      ansible.builtin.service:
        name: apache2
        state: stopped
        enabled: false

    - name: Stop and disable PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: stopped
        enabled: false

    - name: Remove Apache and PHP packages
      ansible.builtin.apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
          - php-pgsql
        state: absent
        purge: true
        autoremove: true

    - name: Remove PostgreSQL packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: absent
        purge: true
        autoremove: true